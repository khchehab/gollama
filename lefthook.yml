commit-msg:
  commands:
    commitizen:
      run: cz check --commit-msg-file {1}

pre-commit:
  commands:
    fmt:
      run: gofmt -l . && test -z "$(gofmt -l .)"
    vet:
      run: go vet ./...
    staticcheck:
      run: staticcheck ./...
    golangci-lint:
      run: golangci-lint run ./...
    mod-tidy:
      run: go mod tidy && git diff --exit-code go.mod

pre-push:
  commands:
    test:
      run: go test ./...
    build:
      run: go build ./...
    vulncheck:
      run: govulncheck ./...
